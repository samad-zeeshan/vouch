<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vouch</title>
<style>
  :root {
    --ink: #0f172a; --ink-2: #334155; --muted: #64748b;
    --line: #e2e8f0; --bg: #f8fafc; --card: #ffffff; --accent: #2563eb;
    --green-bg: #d5eedd; --green-line: #15803d;
    --orange-bg: #fde8c8; --orange-line: #c2410c;
    --red-bg: #fcdcdc; --red-line: #dc2626;
    --ok: #15803d;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.5 var(--sans); color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { padding: 18px 32px; background: var(--card); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; }
  header svg { display: block; }
  header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  header p { margin: 0 0 0 12px; color: var(--muted); font-size: 14px; }
  @media (max-width: 640px) { header p { display: none; } }

  main { max-width: 1280px; margin: 0 auto; padding: 32px; display: grid;
    grid-template-columns: 3fr 2fr; gap: 24px; align-items: start; }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; padding: 20px; } }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04); overflow: hidden; }
  .panel label { display: flex; align-items: center; padding: 12px 20px; font-size: 12px;
    font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--line); }
  textarea, .view { width: 100%; min-height: 440px; padding: 20px; border: 0; margin: 0;
    font: 16px/1.7 var(--serif); color: var(--ink); background: var(--card); display: block; }
  textarea { resize: vertical; }
  textarea:focus-visible { outline-offset: -2px; }
  textarea:disabled { color: inherit; }
  .view { white-space: pre-wrap; overflow-wrap: anywhere; }
  #draft, .view { transition: opacity 150ms var(--ease-out); }
  main.busy #draft, main.busy .view { opacity: .55; }

  .actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button { padding: 10px 20px; min-height: 40px; font: 600 14px/1 var(--sans); cursor: pointer;
    touch-action: manipulation; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff;
    transition: background 120ms ease, border-color 120ms ease, transform 100ms var(--ease-out); }
  button:hover { background: #1d4ed8; border-color: #1d4ed8; }
  button:active { transform: scale(0.98); }
  button.secondary { background: var(--card); border-color: var(--line); color: var(--ink); }
  button.secondary:hover { background: var(--bg); border-color: var(--line); }
  #approve[aria-disabled="false"] { background: var(--ok); border-color: var(--ok); }
  #approve[aria-disabled="false"]:hover { background: #166534; border-color: #166534; }
  button:disabled, button[aria-disabled="true"] { background: #e2e8f0; border-color: #e2e8f0;
    color: var(--muted); cursor: not-allowed; transform: none; }
  #approved { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ok); }
  #summary { margin-left: auto; font-weight: 600; font-size: 14px; color: var(--ink-2); }
  @media (max-width: 880px) { #summary { margin-left: 0; flex-basis: 100%; } }

  #banner { grid-column: 1 / -1; display: none; padding: 12px 16px; border-radius: 8px;
    font-size: 14px; background: #fef6e0; border: 1px solid #f0dfae; color: #713f12; }
  #banner.show { display: block; }

  mark { padding: 1px 3px; border-radius: 3px; background: none; color: inherit; cursor: help; }
  mark.supported { background: var(--green-bg); box-shadow: inset 0 -2px 0 var(--green-line); }
  mark.rounded_up { background: var(--orange-bg); box-shadow: inset 0 -2px 0 var(--orange-line); }
  mark.contradicted { background: var(--red-bg); box-shadow: inset 0 -2px 0 var(--red-line); }
  mark.unsupported { text-decoration: underline dashed var(--muted); text-underline-offset: 4px;
    text-decoration-thickness: 1.5px; }
  .view mark { transition: opacity 180ms var(--ease-out); }
  .view.fresh mark { opacity: 0; transition: none; }

  .legend { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted);
    font-size: 12px; }
  .legend mark { cursor: default; padding: 2px 8px; border-radius: 999px; font-family: var(--sans); }
  .legend mark.unsupported { text-underline-offset: 3px; }

  #tooltip { position: absolute; z-index: 10; max-width: 340px; padding: 8px 12px;
    font: 13px/1.5 var(--sans); background: var(--ink); color: #f8fafc; border-radius: 6px;
    opacity: 0; transform: translateY(4px);
    transition: opacity 120ms var(--ease-out), transform 120ms var(--ease-out);
    pointer-events: none; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.18); }
  #tooltip::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px;
    border: 5px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
  #tooltip.below { transform: translateY(-4px); }
  #tooltip.below::after { bottom: auto; top: -5px; border-top-color: transparent;
    border-bottom: 5px solid var(--ink); border-top: 0; }
  #tooltip.show { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="#2563eb"/>
    <path d="M7.2 12.6l3.2 3.2 6.4-7.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Vouch</h1>
  <p>Paste the draft and the client's approved fact sheet. Click Check.</p>
</header>
<main>
  <section class="panel">
    <label for="draft">Draft release</label>
    <textarea id="draft" spellcheck="false"></textarea>
    <div id="view" class="view" hidden></div>
  </section>
  <section class="panel">
    <label for="facts">Approved fact sheet</label>
    <textarea id="facts" spellcheck="false"></textarea>
  </section>
  <div id="banner"></div>
  <div class="actions">
    <button id="check">Check</button>
    <button id="edit" class="secondary" hidden>Edit draft</button>
    <button id="approve" aria-disabled="true" data-tip="Run a check first">Approve</button>
    <span id="approved" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4.5 12.8l4.7 4.7 10.3-11" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Approved
    </span>
    <span id="summary"></span>
  </div>
  <div class="legend">
    <mark class="supported">supported</mark>
    <mark class="rounded_up">rounded up</mark>
    <mark class="contradicted">contradicted</mark>
    <mark class="unsupported">unsupported</mark>
  </div>
</main>
<div id="tooltip" role="tooltip"></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const draft = $("draft"), facts = $("facts"), view = $("view");
  const checkBtn = $("check"), editBtn = $("edit"), approveBtn = $("approve");
  const summary = $("summary"), banner = $("banner"), approved = $("approved");
  const mainEl = document.querySelector("main");

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // The server counts offsets in code points. JavaScript strings count UTF-16 units, so an emoji
  // before a claim would shift every later highlight by one. Slicing an array of code points
  // keeps both sides counting the same way.
  function render(text, claims) {
    const cps = Array.from(text);
    let out = "", pos = 0;
    for (const c of claims) {
      out += esc(cps.slice(pos, c.start).join(""));
      out += '<mark class="' + c.state + '" tabindex="0" data-tip="' + esc(c.reason) + '">' +
             esc(cps.slice(c.start, c.end).join("")) + '</mark>';
      pos = c.end;
    }
    return out + esc(cps.slice(pos).join(""));
  }

  function words(s) {
    return s.checked + " claims checked. " + s.supported + " supported. " + s.rounded_up +
           " rounded up. " + s.contradicted + " contradicted. " + s.unsupported + " unsupported.";
  }

  function blockers(result) {
    const s = result.summary, parts = [];
    if (s.contradicted) parts.push(s.contradicted + " contradicted");
    if (s.rounded_up) parts.push(s.rounded_up + " rounded up");
    const loose = result.claims.filter((c) => c.state === "unsupported" && c.source === "numeric").length;
    if (loose) parts.push(loose + (loose > 1 ? " numbers" : " number") + " not on the sheet");
    if (!result.model_used) parts.push("prose claims were not checked");
    return parts.join(", ");
  }

  const tip = $("tooltip");

  // One shared bubble instead of the native title. Native tooltips wait a second, cannot be
  // styled, and barely register in a screen recording, which is where this page lives.
  function showTip(target) {
    const text = target.getAttribute("data-tip");
    if (!text) return;
    tip.textContent = text;
    const r = target.getBoundingClientRect();
    const above = r.top - tip.offsetHeight - 10 >= 0;
    tip.classList.toggle("below", !above);
    tip.style.top = scrollY + (above ? r.top - tip.offsetHeight - 10 : r.bottom + 10) + "px";
    const left = scrollX + r.left + r.width / 2 - tip.offsetWidth / 2;
    tip.style.left = Math.max(8, Math.min(left, scrollX + innerWidth - tip.offsetWidth - 16)) + "px";
    tip.classList.add("show");
    target.setAttribute("aria-describedby", "tooltip");
  }

  function hideTip(target) {
    tip.classList.remove("show");
    target.removeAttribute("aria-describedby");
  }

  for (const [over, out] of [["mouseover", "mouseout"], ["focusin", "focusout"]]) {
    document.addEventListener(over, (e) => { const t = e.target.closest("[data-tip]"); if (t) showTip(t); });
    document.addEventListener(out, (e) => { const t = e.target.closest("[data-tip]"); if (t) hideTip(t); });
  }

  function setApprove(enabled, why) {
    approveBtn.setAttribute("aria-disabled", String(!enabled));
    if (enabled) { approveBtn.removeAttribute("data-tip"); hideTip(approveBtn); }
    else approveBtn.setAttribute("data-tip", why);
  }

  // The one intentional motion on the page: highlights fade in once, staggered, with the
  // delay capped so a long draft never takes more than 400ms to light up. Only opacity moves.
  function revealMarks() {
    view.querySelectorAll("mark").forEach((m, i) => {
      m.style.transitionDelay = Math.min(i * 25, 220) + "ms";
    });
    view.classList.add("fresh");
    void view.offsetWidth;
    requestAnimationFrame(() => view.classList.remove("fresh"));
  }

  function showEditor() {
    view.hidden = true; draft.hidden = false; editBtn.hidden = true;
  }

  function failCheck(why) {
    banner.textContent = "The check could not run: " + why + ". Nothing was checked.";
    banner.classList.add("show");
    invalidate();
  }

  async function runCheck() {
    checkBtn.disabled = true; checkBtn.textContent = "Checking...";
    // The old verdict dies the moment a new check starts, so Approve is inert while waiting.
    invalidate();
    draft.disabled = true; facts.disabled = true;
    mainEl.classList.add("busy");
    try {
      let res;
      try {
        res = await fetch("/check", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ draft: draft.value, facts: facts.value }),
        });
      } catch {
        return failCheck("no connection");
      }
      if (!res.ok) return failCheck(String(res.status));
      const result = await res.json();
      view.innerHTML = render(draft.value, result.claims);
      draft.hidden = true; view.hidden = false; editBtn.hidden = false;
      revealMarks();
      summary.textContent = words(result.summary);
      const why = result.warnings.filter((w) => !w.startsWith("model verdict"));
      banner.textContent = why.join(" ");
      banner.classList.toggle("show", why.length > 0);
      setApprove(result.approvable, blockers(result));
    } finally {
      checkBtn.disabled = false; checkBtn.textContent = "Check";
      draft.disabled = false; facts.disabled = false;
      mainEl.classList.remove("busy");
    }
  }

  // Any edit to either box kills the verdict. The whole point of the tool is that a stale
  // Approve can never be clicked, so this must cover the draft too, not just the sheet.
  function invalidate() {
    setApprove(false, "Run a check first");
    summary.textContent = "";
    approved.hidden = true;
  }

  checkBtn.addEventListener("click", runCheck);
  editBtn.addEventListener("click", showEditor);
  // aria-disabled instead of disabled: a disabled button gets no hover events, and the
  // reason this button is off is the third beat of the demo.
  approveBtn.addEventListener("click", () => {
    if (approveBtn.getAttribute("aria-disabled") === "true") return;
    approved.hidden = false;
  });
  draft.addEventListener("input", invalidate);
  facts.addEventListener("input", invalidate);

  fetch("/sample").then((r) => r.json()).then((s) => { draft.value = s.draft; facts.value = s.facts; });
})();
</script>
</body>
</html>
